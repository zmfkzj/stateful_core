name: Rust

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run workspace tests
        run: env -u STATEFUL_CODEX_RUN_ID -u CODEX_THREAD_ID cargo test --workspace
      - name: Run codex-benchmark feature hook tests
        run: cargo test -p stateful-cli --features codex-benchmark --test hook

      - name: Install stateful-bench Python test dependencies
        run: python3 -m venv .venv && . .venv/bin/activate && python -m pip install pytest pytest-timeout
      - name: Run stateful-bench Python script tests
        run: . .venv/bin/activate && python -m pytest -vv --timeout=300 --timeout-method=thread crates/stateful-bench/scripts/tests